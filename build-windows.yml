name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch bundled drivers (pinned SHA-256)
        run: python tools/fetch_drivers.py drivers
      - name: Tests (unit, drivers, TLE, synthetic end-to-end 72k/80k)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests
      - name: Optional code-signing certificate
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        shell: pwsh
        run: |
          if (-not $env:SIGN_PFX_BASE64) { Write-Host 'no certificate configured'; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "METEORRX_SIGN_PFX=$env:RUNNER_TEMP\sign.pfx" >> $env:GITHUB_ENV
      - name: Build MeteorRX.exe (bootloader compiled from source with MSVC)
        shell: cmd
        env:
          METEORRX_SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: MeteorRX-win64
          path: dist/MeteorRX-*-win64.zip
