name: Problem report
description: Reception, receiver or installation problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MeteorRX version
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Receiver and driver
      placeholder: "RTL-SDR Blog V4 / WinUSB, SDRplay RSP1A / API 3.15, LimeSDR Mini 2.0 / D3XX 1.3.0.10 ..."
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what you saw (LEDs, eye diagram, BER, SDR stream %).
    validations:
      required: true
  - type: textarea
    id: live
    attributes:
      label: Receiver test output
      description: "Output of `MeteorRX-cli --selftest` and `MeteorRX-cli --live 30 --device <your receiver>`"
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant part of data\meteorrx.log
      render: text
